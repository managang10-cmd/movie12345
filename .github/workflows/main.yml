name: BMS Tracker 20min
on:
  schedule:
    - cron: '13,33,53 * * * *' # Runs every 20 minutes
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4 requests playwright

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN_2: ${{ secrets.BOT_TOKEN_2 }}
          CHAT_ID_2: ${{ secrets.CHAT_ID_2 }}
          BOT_TOKEN_3: ${{ secrets.BOT_TOKEN_3 }}
          CHAT_ID_3: ${{ secrets.CHAT_ID_3 }}
          BOT_TOKEN_NAGESH: ${{ secrets.BOT_TOKEN_NAGESH }}
          CHAT_ID_NAGESH: ${{ secrets.CHAT_ID_NAGESH }}
          BOT_TOKEN_JERRY: ${{ secrets.BOT_TOKEN_JERRY }}
          CHAT_ID_JERRY: ${{ secrets.CHAT_ID_JERRY }}
          BOT_TOKEN_SATHPREM: ${{ secrets.BOT_TOKEN_SATHPREM }}
          CHAT_ID_SATHPREM: ${{ secrets.CHAT_ID_SATHPREM }}
          BOT_TOKEN_SAMOSA: ${{ secrets.BOT_TOKEN_SAMOSA }}
          CHAT_ID_SAMOSA: ${{ secrets.CHAT_ID_SAMOSA }}
          BOT_TOKEN_SANKA: ${{ secrets.BOT_TOKEN_SANKA }}
          CHAT_ID_SANKA: ${{ secrets.CHAT_ID_SANKA }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          
        run: python bms_tracker.py

      - name: Save and Sync State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add known_movies_*.txt
          if ! git diff --staged --quiet; then
            git commit -m "Update known movies [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in movie list."
          fi
